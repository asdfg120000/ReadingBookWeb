<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>카카오 도서 검색</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f3ee;
            color: #283b33;
            font-family: system-ui, sans-serif;
            line-height: 1.6;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        h1 {
            margin-bottom: 8px;
        }

        h2 {
            font-size: 20px;
            margin-top: 0;
        }

        .card {
            background: white;
            border: 1px solid #e0e4dc;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd4ce;
            border-radius: 8px;
            font: inherit;
        }

        button {
            margin-top: 12px;
            padding: 11px 16px;
            border: 0;
            border-radius: 8px;
            background: #285b46;
            color: white;
            font: inherit;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .secondary {
            background: #e8eee8;
            color: #285b46;
        }

        .small {
            color: #64716b;
            font-size: 14px;
        }

        #message {
            padding: 14px;
            background: #e8eee8;
            border-radius: 10px;
            margin: 18px 0;
            white-space: pre-wrap;
        }

        #message.error {
            background: #f9e7e5;
            color: #852f2f;
        }

        #results {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        .book {
            display: flex;
            gap: 16px;
            background: white;
            padding: 20px;
            border: 1px solid #e0e4dc;
            border-radius: 12px;
        }

        .cover {
            width: 85px;
            height: 125px;
            object-fit: contain;
            flex-shrink: 0;
            background: #f0f0ea;
            border-radius: 5px;
        }

        .book-info {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .book-info h3 {
            font-size: 17px;
            margin: 0 0 8px;
        }

        .book-info p {
            margin: 4px 0;
        }

        .navigation {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 18px;
        }

        a {
            color: #285b46;
        }

        @media (max-width: 700px) {
            #results {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
<main>
    <h1>카카오 도서 검색 📚</h1>
    <p class="small">
        책을 검색하고 선택하면 기존 내 서재에 등록됩니다.
    </p>

    <p>
        <a href="/reading-demo.html" target="_blank" rel="noopener">
            기존 서재·독서기록 화면 열기
        </a>
    </p>

    <section class="card">
        <h2>1. 기존 계정으로 로그인</h2>

        <label for="email">이메일</label>
        <input
                id="email"
                type="email"
                autocomplete="username"
                placeholder="회원가입한 이메일"
        >

        <label for="password">비밀번호</label>
        <input
                id="password"
                type="password"
                autocomplete="current-password"
        >

        <button id="loginButton" type="button">로그인</button>
        <button id="logoutButton" type="button" class="secondary">
            로그아웃
        </button>

        <p id="loginState" class="small">로그인 전</p>
    </section>

    <div id="message" role="status" aria-live="polite">
        먼저 기존 계정으로 로그인해주세요.
    </div>

    <section class="card">
        <h2>2. 도서 검색</h2>

        <label for="query">책 제목 또는 검색어</label>
        <input
                id="query"
                maxlength="200"
                placeholder="예: 전지적 독자 시점"
        >

        <button id="searchButton" type="button">카카오에서 검색</button>
    </section>

    <div id="results"></div>

    <div class="navigation">
        <button id="prevButton" type="button" class="secondary" disabled>
            이전
        </button>

        <span id="pageLabel">1페이지</span>

        <button id="nextButton" type="button" class="secondary" disabled>
            다음
        </button>
    </div>

    <p class="small">
        검색 결과는 다음 책 검색에서 제공됩니다.
        표지가 없는 책은 이미지가 표시되지 않습니다.
    </p>
</main>

<script>
    'use strict';

    const $ = id => document.getElementById(id);

    let token = '';
    let currentQuery = '';
    let currentPage = 1;
    let isEnd = true;
    let searching = false;

    function showMessage(message, error = false) {
        $('message').textContent = message;
        $('message').classList.toggle('error', error);
    }

    function updateNavigation() {
        $('prevButton').disabled =
            searching || !currentQuery || currentPage <= 1;

        $('nextButton').disabled =
            searching || !currentQuery || isEnd || currentPage >= 50;

        $('pageLabel').textContent = currentPage + '페이지';
    }

    async function request(path, method = 'GET', body = null, auth = true) {
        if (location.protocol === 'file:') {
            throw new Error(
                '파일을 더블클릭하지 말고 http://localhost:8080/kakao-books.html 로 접속해주세요.'
            );
        }

        if (auth && !token) {
            throw new Error('먼저 로그인해주세요.');
        }

        const headers = {};

        if (auth) {
            headers.Authorization = 'Bearer ' + token;
        }

        if (body !== null) {
            headers['Content-Type'] = 'application/json';
        }

        let response;

        try {
            response = await fetch(path, {
                method,
                headers,
                body: body === null ? undefined : JSON.stringify(body)
            });
        } catch (error) {
            throw new Error(
                '서버에 연결되지 않았어요. IntelliJ에서 서버 실행 상태를 확인해주세요.'
            );
        }

        const text = await response.text();
        let data = null;

        if (text) {
            try {
                data = JSON.parse(text);
            } catch (error) {
                throw new Error(
                    '서버에서 JSON이 아닌 응답을 받았습니다. 주소와 Security 설정을 확인해주세요.'
                );
            }
        }

        if (!response.ok) {
            if (auth && response.status === 401) {
                token = '';
                $('loginState').textContent = '로그인이 만료됐어요.';
            }

            const error = new Error(
                data?.message || '요청 실패: HTTP ' + response.status
            );

            error.status = response.status;
            throw error;
        }

        return data;
    }

    async function run(button, action) {
        button.disabled = true;

        try {
            await action();
        } catch (error) {
            showMessage(error.message, true);
        } finally {
            button.disabled = false;
        }
    }

    function makeElement(tag, text, className) {
        const element = document.createElement(tag);

        if (text !== undefined) {
            element.textContent = text;
        }

        if (className) {
            element.className = className;
        }

        return element;
    }

    function selectIsbn(value) {
        const parts = (value || '').trim().split(/\s+/);

        return parts.find(part => /^\d{13}$/.test(part))
            || parts.find(part => /^\d{9}[\dXx]$/.test(part))
            || '';
    }

    async function addToShelf(book) {
        const isbn = selectIsbn(book.isbn);

        if (!isbn) {
            throw new Error(
                'ISBN이 없는 책입니다. 기존 화면의 직접 작품 등록을 이용해주세요.'
            );
        }

        const work = await request(
            '/api/kakao/books/import',
            'POST',
            {isbn}
        );

        try {
            await request('/api/shelf', 'POST', {
                workId: work.id,
                status: 'READING'
            });
        } catch (error) {
            if (error.status === 409) {
                showMessage(
                    '이미 내 서재에 있는 책입니다. 기존 화면에서 내 서재를 불러와보세요.'
                );
                return;
            }

            throw error;
        }

        showMessage(
            '「' + work.title + '」을 내 서재에 등록했어요!\n' +
            '기존 화면에서 ‘내 서재 불러오기’를 누르면 독서기록을 작성할 수 있어요.'
        );
    }

    function renderBooks(books) {
        $('results').replaceChildren();

        if (!books.length) {
            $('results').append(
                makeElement('p', '검색 결과가 없어요.')
            );
            return;
        }

        for (const book of books) {
            const card = makeElement('article', undefined, 'book');

            if (book.thumbnail) {
                try {
                    const url = new URL(book.thumbnail);

                    if (url.protocol === 'https:' || url.protocol === 'http:') {
                        const image = document.createElement('img');
                        image.className = 'cover';
                        image.src = url.href;
                        image.alt = book.title + ' 표지';
                        image.loading = 'lazy';

                        image.addEventListener('error', () => {
                            image.remove();
                        });

                        card.append(image);
                    }
                } catch (error) {
                    // 잘못된 이미지 주소는 표시하지 않습니다.
                }
            }

            const info = makeElement('div', undefined, 'book-info');

            info.append(
                makeElement('h3', book.title || '제목 없음'),
                makeElement(
                    'p',
                    '작가: ' + (
                        Array.isArray(book.authors) && book.authors.length
                            ? book.authors.join(', ')
                            : '작가 미상'
                    ),
                    'small'
                ),
                makeElement(
                    'p',
                    '출판사: ' + (book.publisher || '정보 없음'),
                    'small'
                )
            );

            const button = makeElement('button', '내 서재에 등록');
            button.type = 'button';

            if (!selectIsbn(book.isbn)) {
                button.disabled = true;

                info.append(
                    makeElement(
                        'p',
                        'ISBN이 없어 직접 등록이 필요한 책입니다.',
                        'small'
                    )
                );
            } else {
                button.addEventListener('click', () => {
                    run(button, () => addToShelf(book));
                });
            }

            info.append(button);
            card.append(info);
            $('results').append(card);
        }
    }

    async function searchBooks(query, page) {
        const keyword = query.trim();

        if (!keyword) {
            throw new Error('검색어를 입력해주세요.');
        }

        searching = true;
        $('searchButton').disabled = true;
        updateNavigation();

        try {
            const data = await request(
                '/api/kakao/books?query=' +
                encodeURIComponent(keyword) +
                '&page=' + page
            );

            currentQuery = keyword;
            currentPage = page;
            isEnd = data.meta.end;

            renderBooks(data.documents);

            showMessage(
                '검색 결과를 불러왔어요. 원하는 책의 ‘내 서재에 등록’을 누르세요.'
            );
        } finally {
            searching = false;
            $('searchButton').disabled = false;
            updateNavigation();
        }
    }

    $('loginButton').addEventListener('click', () => {
        run($('loginButton'), async () => {
            token = '';
            $('loginState').textContent = '로그인 전';

            const data = await request(
                '/api/auth/login',
                'POST',
                {
                    email: $('email').value,
                    password: $('password').value
                },
                false
            );

            token = data.accessToken;
            $('password').value = '';
            $('loginState').textContent = '로그인 완료';

            showMessage('로그인했어요. 이제 책을 검색해보세요.');
        });
    });

    $('logoutButton').addEventListener('click', () => {
        token = '';
        $('password').value = '';
        $('loginState').textContent = '로그인 전';

        showMessage('이 화면의 로그인 정보를 지웠어요.');
    });

    $('searchButton').addEventListener('click', async () => {
        try {
            await searchBooks($('query').value, 1);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    $('query').addEventListener('keydown', event => {
        if (event.key === 'Enter' && !searching) {
            $('searchButton').click();
        }
    });

    $('prevButton').addEventListener('click', async () => {
        try {
            await searchBooks(currentQuery, currentPage - 1);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    $('nextButton').addEventListener('click', async () => {
        try {
            await searchBooks(currentQuery, currentPage + 1);
        } catch (error) {
            showMessage(error.message, true);
        }
    });

    if (location.protocol === 'file:') {
        showMessage(
            '서버 실행 후 http://localhost:8080/kakao-books.html 로 접속해주세요.',
            true
        );
    }
</script>
</body>
</html>
